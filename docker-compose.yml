services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/SQL:/sql:ro
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID('${DB_DATABASE}') IS NULL CREATE DATABASE [${DB_DATABASE}]" &&
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -d ${DB_DATABASE} -i /sql/script_final.sql
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SERVER: db
      DB_PORT: 1433
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "true"
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      ML_CLIENT_ID: ${ML_CLIENT_ID}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI}
      URL_API: ${URL_API}
      URL_FRONTEND: ${URL_FRONTEND}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ML_URL_AUTH: ${VITE_ML_URL_AUTH}
        VITE_BASE_URL_IMAGES: ${VITE_BASE_URL_IMAGES}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mssql_data:
  backend_uploads: